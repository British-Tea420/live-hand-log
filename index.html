<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Hand Log</title>
<meta name="description" content="Record live poker hands fast and export them to your hand tracker.">
<meta name="theme-color" content="#0E7A55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hand Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, thumb-reachable controls, the current decision always mid-screen */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface2:#F5F8F6; --ink:#14201B; --muted:#5D6B65; --line:#D3DBD6;
  --accent:#0E7A55; --accent-ink:#FFFFFF; --accent-soft:#DCEFE6;
  --raise:#A8660F; --raise-soft:#F7EAD5; --call:#25609E; --call-soft:#DFEAF6; --fold:#6C7873; --fold-soft:#E7ECE9;
  --win:#0E7A55; --loss:#B3261E;
  --s-s:#14201B; --s-h:#C62828; --s-d:#1E5FC2; --s-c:#1B8048;
  --font-d:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-b:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1210; --surface:#151E1A; --surface2:#1A2520; --ink:#E4ECE8; --muted:#8C9D96; --line:#26332D;
  --accent:#2FB37F; --accent-ink:#06130D; --accent-soft:#183327;
  --raise:#E3A64A; --raise-soft:#3A2C17; --call:#64A3E6; --call-soft:#192A3D; --fold:#7D8B85; --fold-soft:#1F2925;
  --win:#3CC48C; --loss:#F06B60;
  --s-s:#E4ECE8; --s-h:#FF6B6B; --s-d:#5AA5FF; --s-c:#46C585; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1210; --surface:#151E1A; --surface2:#1A2520; --ink:#E4ECE8; --muted:#8C9D96; --line:#26332D;
  --accent:#2FB37F; --accent-ink:#06130D; --accent-soft:#183327;
  --raise:#E3A64A; --raise-soft:#3A2C17; --call:#64A3E6; --call-soft:#192A3D; --fold:#7D8B85; --fold-soft:#1F2925;
  --win:#3CC48C; --loss:#F06B60;
  --s-s:#E4ECE8; --s-h:#FF6B6B; --s-d:#5AA5FF; --s-c:#46C585; color-scheme:dark}
html,body{height:100%}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,.disp{font-family:var(--font-d);letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:700;line-height:1.05}
h2{font-size:22px;font-weight:600}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;gap:10px;min-height:40px}
.top .grow{flex:1;min-width:0}
.top .sub{font-size:13px;color:var(--muted)}
.ib{height:40px;min-width:40px;padding:0 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib.warn{color:var(--loss);border-color:var(--loss)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.btn{height:52px;border-radius:12px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:0 12px;font:inherit;font-size:16px;width:100%;box-sizing:border-box}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:40px;min-width:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fold)}
.dot.ok{background:var(--win)}.dot.bad{background:var(--raise)}
/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--muted)}
.res{font-weight:700;text-align:right;white-space:nowrap}
.pos{color:var(--win)}.neg{color:var(--loss)}
.posbadge{font-family:var(--font-d);font-weight:700;font-size:15px;min-width:52px;height:30px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--font-d);font-size:24px;line-height:1.1}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
/* cards */
.card{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:38px;padding:0 4px;border-radius:6px;background:var(--surface);border:1px solid var(--line);font-family:var(--font-d);font-weight:700;font-size:20px;line-height:1;box-sizing:border-box}
.card.sm{min-width:24px;height:26px;font-size:15px;border-radius:5px}
.card.slot{border-style:dashed;color:var(--muted);background:transparent}
.card.slot.cur{border-color:var(--accent);border-style:solid;box-shadow:0 0 0 2px var(--accent-soft)}
.cs{color:var(--s-s)}.ch{color:var(--s-h)}.cd{color:var(--s-d)}.cc{color:var(--s-c)}
.cards{display:inline-flex;gap:3px;vertical-align:middle}
.picker{display:grid;grid-template-columns:repeat(13,1fr);gap:3px}
.pk{height:44px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);font-family:var(--font-d);font-weight:700;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.95;padding:0}
.pk small{font-size:12px}
.pk[disabled]{opacity:.18;cursor:default}
/* hand entry */
.table{display:flex;flex-wrap:wrap;gap:6px}
.seat{flex:1 0 54px;max-width:84px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);padding:5px 4px;text-align:center;display:flex;flex-direction:column;gap:1px}
.seat .n{font-family:var(--font-d);font-weight:700;font-size:15px}
.seat .v{font-size:11px;color:var(--muted);min-height:15px}
.seat .k{font-size:10px;color:var(--muted);opacity:.85}
.seat .k.set{color:var(--raise);font-weight:700;opacity:1}
.seat.act .k{color:var(--accent-ink)}
.seat.editing{outline:2px solid var(--raise);outline-offset:1px}
.seat.hero{border-color:var(--accent)}
.seat.hero .n{color:var(--accent)}
.seat.act{background:var(--accent);border-color:var(--accent)}
.seat.act .n,.seat.act .v{color:var(--accent-ink)}
.seat.out{opacity:.38}
.seat.ai .v{color:var(--raise);font-weight:700}
.status{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pot{font-family:var(--font-d);font-size:20px;font-weight:600}
.prompt{font-family:var(--font-d);font-size:28px;font-weight:700;line-height:1.05}
.prompt em{font-style:normal;color:var(--accent)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.act{height:64px;border-radius:12px;font-weight:700;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;border:1.5px solid transparent}
.act small{font-size:12px;font-weight:600;opacity:.85}
.a-f{background:var(--fold-soft);color:var(--fold);border-color:var(--fold)}
.a-x,.a-c{background:var(--call-soft);color:var(--call);border-color:var(--call)}
.a-b,.a-r{background:var(--raise-soft);color:var(--raise);border-color:var(--raise)}
.jump{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.jump .chip.h{border-color:var(--accent);color:var(--accent)}
.pad{display:flex;flex-direction:column;gap:10px}
.amt{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);padding:10px 14px}
.amt .big{font-family:var(--font-d);font-size:38px;font-weight:700;line-height:1}
.amt .bb{font-family:var(--font-d);font-size:22px;color:var(--raise);font-weight:600}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.key{height:52px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:22px;font-weight:600}
.warnmsg{font-size:13px;color:var(--loss)}
.log{display:flex;flex-direction:column;gap:6px;font-size:13px}
.log .st{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.log .st .lbl{min-width:54px}
.posgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.posbtn{height:64px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-family:var(--font-d);font-size:24px;font-weight:700;position:relative}
.posbtn.sug{border:2px solid var(--accent)}
.posbtn.sug::after{content:"next";position:absolute;top:4px;right:7px;font-family:var(--font-b);font-size:10px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grp .who{min-width:70px;font-weight:600}
.hh{margin:0;font-size:12px;line-height:1.5;white-space:pre;overflow-x:auto;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-height:60vh}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 40px)}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}.prompt{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.act,.chip,.pk,.key,.posbtn,.btn{transition:transform .06s}.act:active,.chip:active,.pk:active,.key:active,.posbtn:active,.btn:active{transform:scale(.97)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{height:36px;padding:0 14px;font-weight:600;font-size:14px;background:var(--surface2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.note{font-size:13px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lastact{font-family:var(--font-d);font-size:22px;font-weight:600;min-height:28px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ---------------- basics ---------------- */
const R='23456789TJQKA', SUITS='shdc', SYM={s:'♠',h:'♥',d:'♦',c:'♣'};
const r2=x=>Math.round(x*100)/100;
const uid36=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CUR={GBP:'£',USD:'$',EUR:'€',CAD:'$',AUD:'$'};
function money(x,code){const v=r2(x);return (CUR[code]||'£')+(Number.isInteger(v)?v:v.toFixed(2));}
function bbs(x,bb){const v=Math.round(x/bb*10)/10;return (Number.isInteger(v)?v:v.toFixed(1));}
function signed(v,s){return (v>0?'+':v<0?'−':'')+s;}
function cardHTML(c,sm){return `<span class="card ${sm?'sm':''} c${c[1]}">${c[0]==='T'?'10':c[0]}${SYM[c[1]]}</span>`;}
function cardsHTML(cs,sm){return `<span class="cards">${cs.map(c=>cardHTML(c,sm)).join('')}</span>`;}

/* ---------------- table positions ---------------- */
const EARLY={1:['BTN'],2:['UTG','BTN'],3:['UTG','CO','BTN'],4:['UTG','HJ','CO','BTN'],5:['UTG','LJ','HJ','CO','BTN'],
  6:['UTG','UTG+1','LJ','HJ','CO','BTN'],7:['UTG','UTG+1','UTG+2','LJ','HJ','CO','BTN'],8:['UTG','UTG+1','UTG+2','UTG+3','LJ','HJ','CO','BTN']};
function positions(n){
  if(n===2) return {pre:['BTN','BB'],post:['BB','BTN'],seats:['BTN','BB']};
  const e=EARLY[n-2]; return {pre:[...e,'SB','BB'],post:['SB','BB',...e],seats:['SB','BB',...e]};
}
// next hand the button moves one seat left, so hero's position moves one step "earlier"
function nextPos(pos,n){const {seats}=positions(n);const i=seats.indexOf(pos);if(i<0)return null;return seats[(i-1+seats.length)%seats.length];}

/* ---------------- hand engine (replays events) ---------------- */
// Straddle types. Stored on a hand as {type, amts:[...]} (one amount per straddler).
const STR={
  utg:   {label:'UTG straddle',k:1},
  double:{label:'Double straddle',k:2},
  triple:{label:'Triple straddle',k:3},
  btn:   {label:'Button straddle',btn:true},
  btnula:{label:'Button straddle (ULA)',btn:true,ula:true}
};
// Older saves used {pos:'UTG'|'BTN', amt}.
function normSd(sd){
  if(!sd||typeof sd!=='object')return null;
  if(!sd.type&&sd.pos)return normSd({type:sd.pos==='BTN'?'btn':'utg',amts:[sd.amt]});
  if(!STR[sd.type])return null;
  const amts=(Array.isArray(sd.amts)?sd.amts:[]).slice(0,3).map(x=>r2(+x)).filter(x=>x>0);
  return amts.length?{type:sd.type,amts}:null;
}
function strAllowed(type,n){const t=STR[type];if(t.btn)return n>=3;return n-2>=Math.max(t.k,2);}
function strTypes(n){return Object.keys(STR).filter(t=>strAllowed(t,n));}
function strDefaults(type,bb){const t=STR[type];return t.btn?[r2(bb*2)]:[2,4,8].slice(0,t.k).map(x=>r2(bb*x));}
// Who posts what, and the preflop action order.
function straddleInfo(sd,n){
  sd=normSd(sd);if(!sd||!strAllowed(sd.type,n))return null;
  const t=STR[sd.type],{pre,post}=positions(n);
  // Button straddle: the SB acts first and action goes round the table.
  // ULA (ultimate last action): the button is skipped until everyone else has finished, see nextActor.
  if(t.btn)return {type:sd.type,label:t.label,posts:[['BTN',sd.amts[0]]],order:post,ula:!!t.ula};
  if(sd.amts.length<t.k)return null;
  // UTG / double / triple: action starts left of the last straddler; the last straddler acts last.
  const who=pre.slice(0,t.k);
  return {type:sd.type,label:t.label,posts:who.map((p,i)=>[p,sd.amts[i]]),order:[...pre.slice(t.k),...who]};
}
// Antes: 'all' = every player posts, 'bb' = big blind posts one ante for the table. Antes are dead money.
function normAnte(a){if(!a||typeof a!=='object'||!['all','bb'].includes(a.type))return null;const amt=r2(+a.amt);return amt>0?{type:a.type,amt}:null;}
// Rake: percentage of the pot with an optional cap, or a fixed amount per hand; optional "no flop, no drop".
function normRake(r){
  if(!r||typeof r!=='object'||!['pct','fixed'].includes(r.type))return null;
  const o={type:r.type,nfnd:!!r.nfnd};
  if(r.type==='pct'){o.pct=Math.min(25,Math.max(0,+r.pct||0));o.cap=Math.max(0,r2(+r.cap||0));if(!(o.pct>0))return null;}
  else{o.fixed=Math.max(0,r2(+r.fixed||0));if(!(o.fixed>0))return null;}
  return o;
}
function anteLabel(a,m){a=normAnte(a);return a?(a.type==='bb'?`BB ante ${m(a.amt)}`:`${m(a.amt)} ante each`):'';}
function rakeLabel(r,m){r=normRake(r);if(!r)return 'No rake';return (r.type==='pct'?`${r.pct}% rake${r.cap?`, ${m(r.cap)} cap`:''}`:`${m(r.fixed)} rake per hand`)+(r.nfnd?', no flop no drop':'');}
function preOrder(h){const i=straddleInfo(h.straddle,h.players);return i?i.order:positions(h.players).pre;}
function strLabel(h,m){const i=straddleInfo(h.straddle,h.players),a=anteLabel(h.ante,m);return (a?' · '+a:'')+(i?` · ${i.label} ${i.posts.map(x=>m(x[1])).join('/')}`:'');}
function replay(h){
  const {pre,post}=positions(h.players),pre0=preOrder(h);
  const P={};
  for(const p of pre){const s=p===h.pos?h.heroStack:((h.stacks&&h.stacks[p])||h.vStack);P[p]={start:s,stack:s,in:0,tot:0,ante:0,folded:false,allin:false,acted:false,mayRaise:true,foldSt:null};}
  const st={P,pre,post,preOrder:pre0,street:0,curBet:0,minRaise:h.bb,board:[],log:[],lastIdx:-1,lastAgg:null,done:null,toAct:null,needBoard:0};
  const put=(p,a,dead)=>{const x=P[p];a=r2(Math.max(0,a));if(a>x.stack){x.start=r2(x.start+a-x.stack);x.stack=a;}
    x.stack=r2(x.stack-a);if(dead)x.ante=r2(x.ante+a);else x.in=r2(x.in+a);x.tot=r2(x.tot+a);if(x.stack<=0){x.stack=0;x.allin=true;}return a;};
  const sbp=h.players===2?'BTN':'SB';
  const an=normAnte(h.ante);st.antes=[];
  if(an){for(const p of (an.type==='bb'?['BB']:positions(h.players).seats))st.antes.push([p,put(p,an.amt,true)]);}
  put(sbp,h.sb);put('BB',h.bb);
  st.blinds=[[sbp,P[sbp].in],['BB',P.BB.in]];
  const sd=straddleInfo(h.straddle,h.players);st.straddles=[];
  if(sd)for(const [sp,amt] of sd.posts){const a=put(sp,amt);st.straddles.push([sp,a]);}
  st.ula=!!(sd&&sd.ula);st.ulaUsed=false;
  st.curBet=Math.max(...pre.map(p=>P[p].in));
  if(sd&&st.curBet>h.bb)st.minRaise=st.curBet;
  st.posted=r2(pre.reduce((a,p)=>a+P[p].tot,0));
  for(const ev of h.events){
    if(ev.t==='board'){
      st.street++;st.board.push(...ev.cards);st.log.push({k:'board',street:st.street,cards:ev.cards});
      for(const p of pre){P[p].in=0;P[p].acted=false;P[p].mayRaise=true;}
      st.curBet=0;st.minRaise=h.bb;st.lastIdx=-1;continue;
    }
    const x=P[ev.p],order=st.street?post:pre0;st.lastIdx=order.indexOf(ev.p);
    const L={k:'act',street:st.street,p:ev.p,a:ev.a};
    if(ev.a==='f'){x.folded=true;x.foldSt=st.street;}
    else if(ev.a==='c'){L.amt=put(ev.p,Math.min(st.curBet-x.in,x.stack));L.allin=x.allin;}
    else if(ev.a==='b'||ev.a==='r'){
      const prev=st.curBet;const target=ev.allin?r2(x.in+x.stack):ev.to;
      L.amt=put(ev.p,target-x.in);L.to=x.in;L.allin=x.allin;L.prev=prev;L.a=prev===0?'b':'r';
      if(x.in>prev){
        const inc=r2(x.in-prev);
        if(inc>=st.minRaise){st.minRaise=inc;for(const p of pre)if(p!==ev.p){P[p].acted=false;P[p].mayRaise=true;}}
        // An all-in for less than a full raise doesn't reopen the betting: players who already acted may only call or fold.
        else for(const p of pre)if(p!==ev.p&&P[p].acted)P[p].mayRaise=false;
        st.curBet=x.in;st.lastAgg=ev.p;}
      else if(x.in<prev){L.a='c';}
    }
    if(st.street===0&&ev.p==='BTN')st.ulaUsed=true;
    x.acted=true;st.log.push(L);
  }
  const live=pre.filter(p=>!P[p].folded);
  if(P[h.pos].folded) st.done='herofold';
  else if(live.length===1) st.done='allfold';
  else{
    const n=nextActor(st);
    if(n) st.toAct=n; else if(st.street===3) st.done='showdown'; else st.needBoard=st.street===0?3:1;
  }
  return st;
}
function nextActor(st){
  const order=st.street?st.post:st.preOrder,P=st.P;
  const can=order.filter(p=>!P[p].folded&&!P[p].allin);
  if(!can.length) return null;
  if(can.length===1&&P[can[0]].in>=st.curBet) return null;
  const n=order.length;
  // Button straddle with ULA: until the button has acted, skip it; it acts once everyone else is done.
  // Once it acts (e.g. raises), normal clockwise order applies.
  const ula=st.street===0&&st.ula&&!st.ulaUsed;
  for(let i=1;i<=n;i++){const p=order[(st.lastIdx+i+n)%n],x=P[p];if(ula&&p==='BTN')continue;if(x.folded||x.allin)continue;if(!x.acted||x.in<st.curBet)return p;}
  if(ula){const x=P.BTN;if(x&&!x.folded&&!x.allin&&(!x.acted||x.in<st.curBet))return 'BTN';}
  return null;
}
// Legal bet/raise-to range for player p: at least a full bet/raise, at most all-in.
function limits(st,p,bb){const x=st.P[p],max=r2(x.in+x.stack);const min=st.curBet===0?bb:r2(st.curBet+st.minRaise);return {min,max,allinOnly:min>=max};}
function options(st,p){
  const x=st.P[p],toCall=r2(st.curBet-x.in);
  const others=st.pre.filter(q=>q!==p&&!st.P[q].folded&&!st.P[q].allin).length;
  const o=[];
  const may=x.mayRaise!==false;
  if(toCall>0){o.push('f','c');if(x.stack>toCall&&others>0&&may)o.push('r');}
  else{o.push('x');if(others>0&&may)o.push(st.curBet===0?'b':'r');}
  return {o,toCall:Math.min(toCall,x.stack),stack:x.stack,inn:x.in};
}

/* ---------------- hand strength ---------------- */
const NM=['Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Jack','Queen','King','Ace'];
const PL=i=>NM[i]==='Six'?'Sixes':NM[i]+'s';
function score5(cs){
  const v=cs.map(c=>R.indexOf(c[0])).sort((a,b)=>b-a),fl=cs.every(c=>c[1]===cs[0][1]);
  const cnt={};v.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  const g=Object.entries(cnt).map(([k,n])=>[n,+k]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  const u=[...new Set(v)];let s=-1;
  if(u.length===5){if(u[0]-u[4]===4)s=u[0];else if(u.join()==='12,3,2,1,0')s=3;}
  if(s>=0&&fl)return[8,s];
  if(g[0][0]===4)return[7,g[0][1],g[1][1]];
  if(g[0][0]===3&&g[1][0]===2)return[6,g[0][1],g[1][1]];
  if(fl)return[5,...v];
  if(s>=0)return[4,s];
  if(g[0][0]===3)return[3,...g.map(x=>x[1])];
  if(g[0][0]===2&&g[1][0]===2)return[2,...g.map(x=>x[1])];
  if(g[0][0]===2)return[1,...g.map(x=>x[1])];
  return[0,...v];
}
function cmpS(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]??-1)-(b[i]??-1);if(d)return d;}return 0;}
function best(cards){
  let b=null;const n=cards.length;
  for(let a=0;a<n;a++)for(let c=a+1;c<n;c++){const five=cards.filter((_,i)=>i!==a&&i!==c);if(five.length!==5)continue;const s=score5(five);if(!b||cmpS(s,b)>0)b=s;}
  if(n===5)b=score5(cards);
  return b;
}
function describe(s){
  const lo=i=>NM[(i+13)%13];
  switch(s[0]){
    case 8:return s[1]===12?'a Royal Flush':`a straight flush, ${lo(s[1]-4===-1?12:s[1]-4)} to ${NM[s[1]]}`;
    case 7:return `four of a kind, ${PL(s[1])}`;
    case 6:return `a full house, ${PL(s[1])} full of ${PL(s[2])}`;
    case 5:return `a flush, ${NM[s[1]]} high`;
    case 4:return `a straight, ${s[1]===3?'Ace':NM[s[1]-4]} to ${NM[s[1]]}`;
    case 3:return `three of a kind, ${PL(s[1])}`;
    case 2:return `two pair, ${PL(s[1])} and ${PL(s[2])}`;
    case 1:return `a pair of ${PL(s[1])}`;
    default:return `high card ${NM[s[1]]}`;
  }
}

/* ---------------- settle pots ---------------- */
// Split a pot in whole pence. Leftover pence (odd chips) go one each to the winners
// closest to the left of the button, as in a live game.
function splitPot(amt,winners,order){
  const w=[...winners].sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  const pence=Math.round(amt*100),each=Math.floor(pence/w.length);let left=pence-each*w.length;
  return w.map(p=>{const x=each+(left>0?1:0);if(left>0)left--;return [p,x/100];});
}
function resolve(h){
  const st=replay(h),P=st.P;let live=st.pre.filter(p=>!P[p].folded);
  // Hero folded with several villains left: the hand is unknown to us, so award it to the last aggressor
  if(st.done==='herofold'&&live.length>1){
    const w=st.lastAgg&&live.includes(st.lastAgg)?st.lastAgg:st.post.find(p=>live.includes(p));
    for(const p of live)if(p!==w){P[p].folded=true;P[p].foldSt=st.street;st.log.push({k:'act',street:st.street,p,a:'f',synthetic:true});}
    live=[w];
  }
  // Antes are dead money: they go to the main pot and are never part of an uncalled bet.
  const bet={};st.pre.forEach(p=>bet[p]=r2(P[p].tot-P[p].ante));
  const tots=st.pre.map(p=>[p,bet[p]]).sort((a,b)=>b[1]-a[1]);
  let refund=null;if(tots[0][1]>tots[1][1])refund={p:tots[0][0],amt:r2(tots[0][1]-tots[1][1])};
  const c={};st.pre.forEach(p=>c[p]=bet[p]);if(refund)c[refund.p]=r2(c[refund.p]-refund.amt);
  const antes=r2(st.pre.reduce((a,p)=>a+P[p].ante,0));
  const betTotal=r2(st.pre.reduce((a,p)=>a+c[p],0)),total=r2(betTotal+antes);
  const levels=[...new Set(live.map(p=>c[p]))].sort((a,b)=>a-b);
  const pots=[];let prev=0;
  for(const L of levels){
    let amt=0;for(const p of st.pre)amt+=Math.min(c[p],L)-Math.min(c[p],prev);amt=r2(amt);
    const el=live.filter(p=>c[p]>=L);
    if(amt>0){const last=pots[pots.length-1];if(last&&last.el.length===el.length)last.amt=r2(last.amt+amt);else pots.push({amt,el});}
    prev=L;
  }
  const sumP=r2(pots.reduce((a,b)=>a+b.amt,0));
  if(pots.length&&betTotal>sumP)pots[pots.length-1].amt=r2(pots[pots.length-1].amt+betTotal-sumP);
  if(!pots.length)pots.push({amt:0,el:live});
  pots[0].amt=r2(pots[0].amt+antes);
  // Rake comes off the pot before it is paid out, main pot first.
  const rk=normRake(h.rake);let rake=0;
  if(rk&&!(rk.nfnd&&st.board.length===0)){
    if(rk.type==='pct'){rake=Math.floor(Math.round(total*100)*rk.pct/100)/100;if(rk.cap>0)rake=Math.min(rake,rk.cap);}
    else rake=Math.min(rk.fixed,total);
  }
  rake=r2(rake);{let left=rake;for(const pot of pots){const t=Math.min(left,pot.amt);pot.amt=r2(pot.amt-t);left=r2(left-t);}}
  const cardsOf=p=>p===h.pos?(h.heroCards||[]):((h.shown||{})[p]||[]);
  const val={};
  if(st.board.length===5)for(const p of live)if(cardsOf(p).length===2)val[p]=best([...cardsOf(p),...st.board]);
  const col={};
  for(const pot of pots){
    let w;
    if(pot.el.length===1)w=pot.el;
    else if(pot.el.every(p=>val[p])){let top=null;for(const p of pot.el){if(!top||cmpS(val[p],val[top[0]])>0)top=[p];else if(cmpS(val[p],val[top[0]])===0)top.push(p);}w=top;}
    else{w=pot.el.filter(p=>(h.winners||[]).includes(p));if(!w.length)w=pot.el;}
    pot.split=splitPot(pot.amt,w,st.post);pot.w=pot.split.map(x=>x[0]);
    for(const [p,a] of pot.split)col[p]=r2((col[p]||0)+a);
  }
  const hero=h.pos;
  const net=r2((col[hero]||0)+(refund&&refund.p===hero?refund.amt:0)-P[hero].tot);
  return {st,refund,pots,col,val,total,rake,live,net,cardsOf};
}
function canAutoWinner(h,st){
  const live=st.pre.filter(p=>!st.P[p].folded);
  if(st.board.length<5)return false;
  return live.every(p=>(p===h.pos?h.heroCards:(h.shown[p]||[])).length===2);
}

/* ---------------- PokerStars-format export ---------------- */
function etStamp(ms){
  try{
    const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date(ms));
    const g=t=>parts.find(p=>p.type===t).value;const hh=g('hour')==='24'?'00':g('hour');
    return `${g('year')}/${g('month')}/${g('day')} ${hh}:${g('minute')}:${g('second')} ET`;
  }catch(e){const d=new Date(ms);const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}/${z(d.getMonth()+1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())} ET`;}
}
function handText(h,sess){
  const res=resolve(h),{st,refund,pots,col,val}=res,P=st.P,code=sess.cur||'GBP',m=x=>money(x,code);
  const name=p=>p===h.pos?(sess.heroName||'Hero'):p;
  const {seats}=positions(h.players);
  const seatNo=p=>seats.indexOf(p)+1;
  const tname=(sess.name||'Live').replace(/'/g,'');
  const L=[];
  L.push(`PokerStars Hand #${h.at}:  Hold'em No Limit (${m(h.sb)}/${m(h.bb)} ${code}) - ${etStamp(h.at)}`);
  L.push(`Table '${tname}' ${h.players}-max Seat #${seatNo('BTN')} is the button`);
  for(const p of seats)L.push(`Seat ${seatNo(p)}: ${name(p)} (${m(P[p].start)} in chips)`);
  for(const [ap,a] of st.antes)L.push(`${name(ap)}: posts the ante ${m(a)}`);
  L.push(`${name(st.blinds[0][0])}: posts small blind ${m(st.blinds[0][1])}`);
  L.push(`${name('BB')}: posts big blind ${m(st.blinds[1][1])}`);
  for(const [sp,a] of st.straddles)L.push(`${name(sp)}: posts straddle ${m(a)}`);
  L.push('*** HOLE CARDS ***');
  if(h.heroCards&&h.heroCards.length===2)L.push(`Dealt to ${name(h.pos)} [${h.heroCards.join(' ')}]`);
  const board=[];
  for(const e of st.log){
    if(e.k==='board'){
      if(e.street===1){board.push(...e.cards);L.push(`*** FLOP *** [${board.join(' ')}]`);}
      else{L.push(`*** ${e.street===2?'TURN':'RIVER'} *** [${board.join(' ')}] [${e.cards[0]}]`);board.push(e.cards[0]);}
      continue;
    }
    const n=name(e.p),ai=e.allin?' and is all-in':'';
    if(e.a==='f')L.push(`${n}: folds`);
    else if(e.a==='x')L.push(`${n}: checks`);
    else if(e.a==='c')L.push(`${n}: calls ${m(e.amt)}${ai}`);
    else if(e.a==='b')L.push(`${n}: bets ${m(e.amt)}${ai}`);
    else if(e.a==='r')L.push(`${n}: raises ${m(r2(e.to-e.prev))} to ${m(e.to)}${ai}`);
  }
  if(refund)L.push(`Uncalled bet (${m(refund.amt)}) returned to ${name(refund.p)}`);
  const live=res.live,sd=live.length>1;
  const winners=new Set(Object.keys(col));
  if(sd){
    L.push('*** SHOW DOWN ***');
    for(const p of st.post){if(!live.includes(p))continue;const cs=res.cardsOf(p);
      if(cs.length===2)L.push(`${name(p)}: shows [${cs.join(' ')}]${val[p]?` (${describe(val[p])})`:''}`);
      else if(!winners.has(p))L.push(`${name(p)}: mucks hand`);}
  }
  pots.forEach((pot,i)=>{
    const lbl=pots.length===1?'pot':i===0?'main pot':`side pot-${i}`;
    pot.split.forEach(([p,a])=>L.push(`${name(p)} collected ${m(a)} from ${lbl}`));
  });
  if(!sd&&live.length===1)L.push(`${name(live[0])}: doesn't show hand`);
  L.push('*** SUMMARY ***');
  const potStr=pots.length>1?`Total pot ${m(res.total)} Main pot ${m(pots[0].amt)}. ${pots.slice(1).map((p,i)=>`Side pot-${i+1} ${m(p.amt)}.`).join(' ')} | Rake ${m(res.rake)}`:`Total pot ${m(res.total)} | Rake ${m(res.rake)}`;
  L.push(potStr);
  if(st.board.length)L.push(`Board [${st.board.join(' ')}]`);
  const STN=['before Flop','on the Flop','on the Turn','on the River'];
  for(const p of seats){
    const x=P[p];let tag='';
    if(p==='BTN')tag+=' (button)';
    if(p===st.blinds[0][0])tag+=' (small blind)';
    if(p==='BB')tag+=' (big blind)';
    let d;
    if(x.folded){d=`folded ${STN[x.foldSt]}`;if(x.foldSt===0&&x.tot-x.ante<=0)d+=" (didn't bet)";}
    else if(!sd)d=`collected (${m(col[p]||0)})`;
    else{const cs=res.cardsOf(p);
      if(cs.length===2&&val[p])d=winners.has(p)?`showed [${cs.join(' ')}] and won (${m(col[p])}) with ${describe(val[p])}`:`showed [${cs.join(' ')}] and lost with ${describe(val[p])}`;
      else if(winners.has(p))d=`collected (${m(col[p])})`;
      else d='mucked';}
    L.push(`Seat ${seatNo(p)}: ${name(p)}${tag} ${d}`);
  }
  return L.join('\n');
}

function readable(h,cur,unit){

  L.push(`NL Hold'em ${money(h.sb,cur)}/${money(h.bb,cur)} · ${h.players}-handed`);
  L.push(`Hero ${h.pos} · ${A(st.P[h.pos].start)} stack${h.heroCards&&h.heroCards.length===2?' · '+cs(h.heroCards):''}`);
  if(st.antes.length)L.push(anteLabel(h.ante,A));
  for(const [sp,a] of st.straddles)L.push(`${nm(sp)} straddles ${A(a)}`);
  const short=Object.keys(h.stacks||{}).filter(p=>p!==h.pos&&st.pre.includes(p));
  if(short.length)L.push('Stacks: '+short.map(p=>`${p} ${A(st.P[p].start)}`).join(', ')+` · others ${A(h.vStack)}`);

  const tot={};st.pre.forEach(p=>tot[p]=0);st.blinds.forEach(([p,a])=>tot[p]+=a);for(const [sp,a] of st.straddles)tot[sp]+=a;
  const dead=st.antes.reduce((a,x)=>a+x[1],0);
  const potNow=()=>{const v=Object.values(tot).sort((a,b)=>b-a);return r2(v.reduce((a,b)=>a+b,0)-(v[0]-v[1])+dead);};
  const heads=['Preflop','','',''],parts=[[],[],[],[]];
  for(const e of st.log){
    if(e.k==='board'){heads[e.street]=`${['','Flop','Turn','River'][e.street]} (${A(potNow())}) ${cs(e.cards)}`;continue;}
    if(e.synthetic)continue;
    let t=nm(e.p)+' ';
    if(e.a==='f')t+='folds';else if(e.a==='x')t+='checks';else if(e.a==='c')t+='calls '+A(e.amt);else if(e.a==='b')t+='bets '+A(e.to);else t+='raises to '+A(e.to);

  const pf=parts[0];let k=0;while(k<pf.length&&/ folds$/.test(pf[k])&&!pf[k].startsWith('Hero'))k++;
  if(k>1)parts[0]=[`${k} folds`,...pf.slice(k)];
  for(let i=0;i<4;i++)if(heads[i])L.push(`${heads[i]}${parts[i].length?': '+parts[i].join(', '):''}`);
  if(r.live.length>1){L.push('Showdown: '+r.live.map(p=>{const c=r.cardsOf(p);return `${nm(p)} ${c.length===2?'shows '+cs(c)+(r.val[p]?` (${describe(r.val[p])})`:''):'mucks'}`;}).join(', '));}
  if(st.done!=='herofold')L.push(Object.entries(r.col).map(([p,a])=>`${nm(p)} wins ${A(a)}`).join(', ')+(r.rake>0?` (rake ${A(r.rake)})`:''));
  L.push(`Result for Hero: ${signed(r.net,unit==='bb'?Math.abs(bbs(r.net,bb))+'bb':money(Math.abs(r.net),cur))}`);
  return L.join('\n');
}

  }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;e.preventDefault();act(b.dataset.a,b.dataset);});
document.addEventListener('submit',e=>{
  if(e.target.id!=='setupForm')return;e.preventDefault();
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';},num=id=>parseFloat(g(id));
  const err=document.getElementById('setupErr'),fail=t=>{err.hidden=false;err.textContent=t;err.scrollIntoView({block:'center'});};
  const sb=num('sSb'),bb=num('sBb'),hero=num('sHero');let stack=num('sStack');
  if(!(sb>0)||!(bb>0))return fail('Enter the small blind and big blind, for example 1 and 2.');
  if(bb<sb)return fail('The big blind must be at least the small blind.');
  if(!(hero>0))return fail('Enter your buy-in, for example 200.');
  if(g('sStack')&&!(stack>0))return fail('Enter the typical villain stack as an amount, or leave it blank to use your buy-in.');
  if(!(stack>0))stack=hero;
  let ante=null;const at=g('sAnteType');
  if(at){ante=normAnte({type:at,amt:num('sAnteAmt')});if(!ante)return fail('Enter the ante amount.');}
  let straddle=null;const stt=g('sStrType');
  if(stt){const k=STR[stt].btn?1:STR[stt].k,def=strDefaults(stt,bb);const amts=[];
    for(let i=0;i<k;i++){const raw=g('sStr'+i);const v=raw?parseFloat(raw):def[i];if(!(v>0))return fail('Enter each straddle as an amount, or leave it blank for the usual size.');amts.push(r2(v));}
    straddle=normSd({type:stt,amts});}
  let rake=null;const rt=g('sRakeType');
  if(rt==='pct'){rake=normRake({type:'pct',pct:num('sRakePct'),cap:g('sRakeCap')?num('sRakeCap'):0,nfnd:document.getElementById('sNfnd').checked});if(!rake)return fail('Enter the rake percentage, for example 5.');}
  if(rt==='fixed'){rake=normRake({type:'fixed',fixed:num('sRakeFixed'),nfnd:document.getElementById('sNfnd').checked});if(!rake)return fail('Enter the rake taken per hand.');}
  const s={id:'s'+uid36(),name:g('sName')||'Live '+new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'}),sb:r2(sb),bb:r2(bb),cur:g('sCur'),players:ui.setupPlayers,
    heroStack:r2(hero),stack:r2(stack),heroName:(g('sName2')||'Hero').replace(/[:\[\]<>]/g,'')||'Hero',createdAt:Date.now(),ante,rake,lastStraddle:straddle};
  putSession(s);ui.sid=s.id;askPersist();startHand();
});
document.addEventListener('change',e=>{if(['sAnteType','sStrType','sRakeType'].includes(e.target.id))syncSetup();});
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#setupForm')){const er=document.getElementById('setupErr');if(er)er.hidden=true;}});
document.addEventListener('input',e=>{
  const h=ui.hand;if(!h||ui.view!=='hand')return;
  if(e.target.id==='heroStackIn'){const v=r2(parseFloat(e.target.value));const lab=document.getElementById('heroStackBb');
    if(v>0){h.heroStack=v;saveDraft();if(lab)lab.textContent=bbs(v,h.bb)+' bb';}else if(lab)lab.textContent='– bb';}
  if(e.target.classList.contains('stramt')&&h.straddle){const i=+e.target.dataset.i,v=r2(parseFloat(e.target.value));const lab=document.getElementById('strBb'+i);
    if(v>0){h.straddle.amts[i]=v;saveDraft();if(lab)lab.textContent=bbs(v,h.bb)+' bb';}else if(lab)lab.textContent='– bb';}
});
document.addEventListener('change',e=>{
  const h=ui.hand;if(!h)return;const s=S();if(!s)return;
  if(e.target.id==='heroStackIn'&&h.heroStack>0){s.heroStack=h.heroStack;putSession(s);}
  if(e.target.classList.contains('stramt')&&h.straddle){s.lastStraddle=normSd(h.straddle);putSession(s);}
  if(e.target.id==='strType'){const t=e.target.value;
    if(!t)h.straddle=null;
    else{const old=normSd(h.straddle),def=strDefaults(t,h.bb);h.straddle={type:t,amts:def.map((x,i)=>old&&old.amts[i]&&!!STR[t].btn===!!STR[old.type].btn?old.amts[i]:x)};}
    s.lastStraddle=normSd(h.straddle);putSession(s);saveDraft();render();}
});
document.addEventListener('keydown',e=>{
  if(ui.view!=='hand'||e.target.tagName==='INPUT')return;
  if(ui.stackPad){
    if(/^[0-9.]$/.test(e.key)){act('key',{k:e.key});e.preventDefault();}
    else if(e.key==='Backspace'){act('key',{k:'⌫'});e.preventDefault();}
    else if(e.key==='Enter'){act('stackOk',{});e.preventDefault();}
    else if(e.key==='Escape'){act('stackCancel',{});}
    return;
  }
  if(!ui.pad)return;
  if(/^[0-9.]$/.test(e.key)){act('key',{k:e.key});e.preventDefault();}
  else if(e.key==='Backspace'){act('key',{k:'⌫'});e.preventDefault();}
  else if(e.key==='Enter'){const b=document.querySelector('[data-a="padOk"]');if(b&&!b.disabled)act('padOk',{});e.preventDefault();}
  else if(e.key==='Escape'){act('padCancel',{});}
});

/* ---------------- boot ---------------- */
try{ui.unit=localStorage.getItem('hand-log.unit')||'bb';ui.withLink=localStorage.getItem('hand-log.withLink')!=='0';}catch(e){ui.unit='bb';ui.withLink=true;}
loadLocal();
// Recalculate stored results so hands saved by older versions (e.g. the uneven-chop bug) show correct numbers.
(function fixResults(){let changed=false;for(const h of Object.values(DATA.hands)){try{if(h.deleted)continue;const r=resolve(h);if(r.net!==h.net){h.net=r.net;changed=true;}}catch(e){}}
  if(changed)saveLocal();})();
const draft=loadDraft();
if(draft&&DATA.sessions[draft.sid]&&!DATA.sessions[draft.sid].deleted){ui.hand=draft;ui.sid=draft.sid;ui.view='hand';}
openFromHash();
render();
window.addEventListener('hashchange',()=>{if(openFromHash())render();});
document.addEventListener('change',async e=>{
  if(e.target.id!=='restoreFile'||!e.target.files[0])return;
  try{
    const j=JSON.parse(await e.target.files[0].text());const d=j&&j.data;
    if(!d||typeof d.sessions!=='object'||typeof d.hands!=='object')throw 0;
    let n=0;
    // A backup file may come from someone else: keep only well-formed records and clean every field.
    const num=(x,dflt)=>{x=+x;return isFinite(x)&&x>=0?r2(x):dflt;};
    const okId=x=>typeof x==='string'&&/^[a-z0-9]{1,40}$/i.test(x);
    const sess={},hands={};
    for(const v of Object.values(d.sessions||{})){if(!v||!okId(v.id))continue;
      sess[v.id]={id:v.id,name:String(v.name||'Live game').slice(0,80),sb:num(v.sb,1),bb:num(v.bb,2),cur:CUR[v.cur]?v.cur:'GBP',
        players:Math.min(10,Math.max(2,Math.round(+v.players)||9)),heroStack:num(v.heroStack,200),stack:num(v.stack,200),
        heroName:String(v.heroName||'Hero').replace(/[:\[\]<>]/g,'').slice(0,30)||'Hero',createdAt:num(v.createdAt,Date.now()),
        updatedAt:num(v.updatedAt,0),deleted:!!v.deleted,shared:!!v.shared,
        lastStraddle:normSd(v.lastStraddle),ante:normAnte(v.ante),rake:normRake(v.rake)};}
    for(const v of Object.values(d.hands||{})){
      try{if(!v||!okId(v.id)||!okId(v.sid))continue;
        const players=Math.min(10,Math.max(2,Math.round(+v.players)||9)),pre=positions(players).pre;
        if(!pre.includes(v.pos))continue;
        const cards=a=>Array.isArray(a)?a.filter(c=>/^[2-9TJQKA][shdc]$/.test(c)).slice(0,2):[];
        const events=(v.events||[]).map(e=>e&&e.t==='board'?{t:'board',cards:(e.cards||[]).filter(c=>/^[2-9TJQKA][shdc]$/.test(c))}
          :{p:pre.includes(e.p)?e.p:null,a:'fxcbr'.includes(e.a)&&e.a.length===1?e.a:null,...(e.allin?{allin:true}:{}),...(e.to!=null?{to:num(e.to,0)}:{})});
        if(events.some(e=>e.t!=='board'&&(!e.p||!e.a)))continue;
        const shown={};for(const [k,c] of Object.entries(v.shown||{}))if(pre.includes(k))shown[k]=cards(c);
        const h={id:v.id,sid:v.sid,n:Math.max(1,Math.round(+v.n)||1),at:num(v.at,Date.now()),players,sb:num(v.sb,1),bb:num(v.bb,2),
          heroStack:num(v.heroStack,200),vStack:num(v.vStack,200),pos:v.pos,events,heroCards:cards(v.heroCards),shown,
          winners:(v.winners||[]).filter(p=>pre.includes(p)),updatedAt:num(v.updatedAt,0),deleted:!!v.deleted,
          straddle:straddleInfo(v.straddle,players)?normSd(v.straddle):null,stacks:cleanStacks(v.stacks,pre),ante:normAnte(v.ante),rake:normRake(v.rake)};
        const r=resolve(h);h.net=r.net;h.summary=summarize(h,r);hands[h.id]=h;
      }catch(err){}
    }
    d.sessions=sess;d.hands=hands;
    for(const [k,v] of Object.entries(d.sessions)){const l=DATA.sessions[k];if(!l||(v.updatedAt||0)>(l.updatedAt||0))DATA.sessions[k]=v;}
    for(const [k,v] of Object.entries(d.hands)){const l=DATA.hands[k];if(!l||(v.updatedAt||0)>(l.updatedAt||0)){DATA.hands[k]=v;n++;}}
    saveLocal();toast(`Restored ${n} hand${n===1?'':'s'}`);go('home');
  }catch(err){toast('That file is not a Live Hand Log backup.');}
  e.target.value='';
});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
